    <!-- Chat Styles (zitaongezwa kwenye styles.css baadaye) -->
    <style>
        /* Chat Interface Styles - Zitaongezwa kwenye styles.css */
        .chat-interface {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-interface.active {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) var(--space-lg);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .chat-header-left .logo-icon {
            width: 32px;
            height: 32px;
        }

        .chat-header-left h2 {
            font-size: var(--text-lg);
            font-weight: 600;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .chat-header-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-header-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .chat-header-btn:active {
            transform: translateY(0);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .message {
            display: flex;
            gap: var(--space-md);
            max-width: 80%;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--accent-gradient);
            color: white;
        }

        .message-content {
            background: var(--bg-tertiary);
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            line-height: 1.6;
            color: var(--text-primary);
        }

        .message.user .message-content {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .message-time {
            font-size: var(--text-xs);
            color: var(--text-tertiary);
            margin-top: var(--space-xs);
        }

        .chat-input-area {
            padding: var(--space-lg);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .chat-input-container {
            display: flex;
            gap: var(--space-md);
            align-items: flex-end;
        }

        .chat-input-wrapper {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-sm) var(--space-md);
        }

        .chat-input-wrapper textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: var(--text-sm);
            line-height: 1.6;
            resize: none;
            min-height: 60px;
            max-height: 150px;
            outline: none;
        }

        .chat-input-wrapper textarea::placeholder {
            color: var(--text-tertiary);
        }

        .chat-actions {
            display: flex;
            gap: var(--space-sm);
        }

        .chat-action-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-action-btn:hover:not(:disabled) {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .chat-action-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .chat-action-btn.send-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
        }

        .chat-action-btn.send-btn:hover:not(:disabled) {
            box-shadow: var(--shadow-glow);
        }

        .chat-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .provider-selector {
            display: flex;
            gap: var(--space-xs);
            margin-top: var(--space-sm);
        }

        .provider-option {
            padding: var(--space-xs) var(--space-md);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .provider-option:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .provider-option.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-tertiary);
            border-radius: 50%;
            animation: typing 1s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .image-preview {
            max-width: 300px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
